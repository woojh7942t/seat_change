<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 자리 배치 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        .desk { transition: all 0.2s; }
        .desk.locked { background-color: #e5e7eb; border-color: #9ca3af; opacity: 0.7; }
        .desk.locked .student-info { display: none; }
        .desk.locked::after { content: '사용 불가'; position: absolute; color: #6b7280; font-size: 0.75rem; font-weight: 600; }
        
        .desk:not(.locked):hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-color: #3b82f6; }
        .desk.pinned { border-color: #f43f5e; border-width: 2px; }
        .desk.pinned::after { content: '🔒 고정'; position: absolute; top: 2px; right: 2px; color: #e11d48; font-size: 0.6rem; font-weight: 700; background-color: #ffe4e6; padding: 1px 3px; border-radius: 4px; }
        
        @media print {
            @page { size: A4 landscape; margin: 8mm; }
            body, html { background-color: white !important; margin: 0 !important; padding: 0 !important; height: 100vh !important; }
            .no-print { display: none !important; }
            .print-full { width: 100% !important; height: 100vh !important; }
            
            body.teacher-print .chalkboard-bg { order: 3 !important; margin-top: 15px !important; }
            body.teacher-print .bg-amber-700 { order: 2 !important; margin-bottom: 15px !important; }
            body.teacher-print #seatingContainer { order: 1 !important; transform: rotate(180deg) !important; margin-bottom: 20px !important; }
            body.teacher-print .desk { transform: rotate(180deg) !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        .chalkboard-bg { background-color: #2d4a22; background-image: radial-gradient(#3a5c2d 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center text-gray-800">

<div class="max-w-[1400px] w-full flex flex-col lg:flex-row gap-6 items-start">
    <div class="flex-[5] w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col print-full border border-gray-100">
        <div class="bg-blue-600 text-white py-4 px-6 flex justify-between items-center no-print">
            <h2 class="text-xl font-bold">교실 자리 배치도</h2>
        </div>

        <div class="p-4 border-b border-gray-100 flex flex-wrap gap-2 items-end bg-gray-50 no-print">
            <div class="w-20"><label class="block text-xs text-gray-600 mb-1">세로(열)</label><select id="cols" class="w-full border rounded px-2 py-1.5 text-sm"></select></div>
            <div class="w-20"><label class="block text-xs text-gray-600 mb-1">가로(행)</label><select id="rows" class="w-full border rounded px-2 py-1.5 text-sm"></select></div>
            <button id="generateBtn" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm">자리 생성</button>
            <button id="printBtn" class="bg-emerald-500 text-white px-4 py-1.5 rounded text-sm">학생용 출력</button>
            <button id="teacherPrintBtn" class="bg-teal-600 text-white px-4 py-1.5 rounded text-sm">교사용 출력</button>
        </div>

        <div class="flex-1 p-6 flex flex-col items-center w-full overflow-y-auto">
            <div class="w-full max-w-2xl h-12 chalkboard-bg rounded border-4 border-gray-700 flex items-center justify-center mb-6"><span class="text-white font-bold">칠판</span></div>
            <div id="seatingContainer" class="grid gap-2 w-full max-w-4xl place-content-center"></div>
        </div>
    </div>

    <div class="flex-[2] w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[500px] no-print">
        <div class="bg-indigo-600 text-white py-4 px-5 font-bold">학생 명단 관리</div>
        <div class="p-4 bg-indigo-50 border-b flex gap-2">
            <input type="number" id="singleNumInput" class="w-14 border rounded px-1 text-sm" placeholder="번호">
            <input type="text" id="singleNameInput" class="flex-1 border rounded px-2 text-sm" placeholder="이름">
            <button id="addSingleBtn" class="bg-indigo-600 text-white px-3 rounded text-sm">+</button>
        </div>
        <div id="studentListContainer" class="flex-1 overflow-y-auto p-2"></div>
        <button id="resetStudentsBtn" class="m-4 bg-red-100 text-red-700 py-2 rounded text-sm font-bold">명단 전체 초기화</button>
    </div>
</div>

<script>
    let studentData = JSON.parse(localStorage.getItem('seating_students')) || [];

    const studentListContainer = document.getElementById('studentListContainer');
    const singleNumInput = document.getElementById('singleNumInput');
    const singleNameInput = document.getElementById('singleNameInput');
    const addSingleBtn = document.getElementById('addSingleBtn');
    const resetStudentsBtn = document.getElementById('resetStudentsBtn');

    function saveToBrowser() {
        localStorage.setItem('seating_students', JSON.stringify(studentData));
    }

    function renderStudentList() {
        studentListContainer.innerHTML = '';
        studentData.sort((a, b) => a.num - b.num).forEach(s => {
            const div = document.createElement('div');
            div.className = 'flex justify-between p-2 bg-white border mb-1 rounded text-sm';
            div.innerHTML = `<span>${s.num}번 ${s.name}</span><button onclick="deleteStudent(${s.num})" class="text-red-500">삭제</button>`;
            studentListContainer.appendChild(div);
        });
        saveToBrowser();
    }

    window.deleteStudent = (num) => {
        studentData = studentData.filter(s => s.num !== num);
        renderStudentList();
    };

    addSingleBtn.onclick = () => {
        const num = parseInt(singleNumInput.value);
        const name = singleNameInput.value.trim();
        if(num && name) {
            studentData = studentData.filter(s => s.num !== num);
            studentData.push({num, name});
            renderStudentList();
            singleNameInput.value = '';
        }
    };

    resetStudentsBtn.onclick = () => { if(confirm('정말 삭제할까요?')) { studentData = []; renderStudentList(); } };

    // 초기화
    renderStudentList();
    
    // 자리 생성 관련 로직은 이전과 동일하게 유지
    const generateDesks = () => {
        const cols = parseInt(document.getElementById('cols').value) || 5;
        const rows = parseInt(document.getElementById('rows').value) || 5;
        const container = document.getElementById('seatingContainer');
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        container.innerHTML = '';
        for(let i=0; i<rows*cols; i++) {
            const div = document.createElement('div');
            div.className = 'desk aspect-[4/3] bg-white border-2 rounded flex items-center justify-center p-2 text-xs font-bold';
            div.innerText = '빈 자리';
            container.appendChild(div);
        }
    };

    // 옵션 세팅
    for(let i=1; i<=10; i++) {
        document.getElementById('cols').innerHTML += `<option value="${i}">${i}</option>`;
        document.getElementById('rows').innerHTML += `<option value="${i}">${i}</option>`;
    }
    document.getElementById('generateBtn').onclick = generateDesks;
    document.getElementById('printBtn').onclick = () => window.print();
    document.getElementById('teacherPrintBtn').onclick = () => { document.body.classList.add('teacher-print'); window.print(); document.body.classList.remove('teacher-print'); };
    generateDesks();
</script>
</body>
</html>
